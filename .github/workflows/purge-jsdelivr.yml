name: 'Purge jsDelivr Cache'

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge All Files from jsDelivr
        run: |
          echo "Starting full repository purge..."
          
          # IFS= and -r are critical here to handle spaces and special characters in file names
          git ls-files | while IFS= read -r file; do
            
            # Skip GitHub-specific files since they aren't hosted on jsDelivr
            if [[ "$file" == .github/* ]]; then
              continue
            fi
            
            # URL encode spaces (%20) so curl doesn't break
            encoded_file=$(echo "$file" | sed 's/ /%20/g')

            echo -n "Purging: $encoded_file ... "
            
            # Fetch the HTTP status code (200 = success, 429 = rate limited, 404 = not found)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/mlnitoon2/project-sonorous-data@main/$encoded_file")
            
            echo "HTTP $STATUS"
            
            # Sleep for 0.3 seconds to heavily avoid jsDelivr's rate limiter
            sleep 0.3
          done
          
          echo "Full purge complete!"
