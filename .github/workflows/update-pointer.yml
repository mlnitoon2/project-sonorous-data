name: Update Version Pointer

on:
  push:
    branches:
      - main

jobs:
  update-pointer:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the commit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write latest SHA to version.json
        run: |
          echo "{\"sha\": \"${{ github.sha }}\"}" > version.json
          
          # Check if the file changed to avoid empty commits
          if git diff --quiet version.json; then
            echo "version.json is already up to date."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version pointer to ${{ github.sha }}"
          git push
