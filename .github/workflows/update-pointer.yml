name: Update Version Pointer
on:
  push:
    branches:
      - main
jobs:
  update-pointer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "{\"sha\": \"${{ github.sha }}\"}" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update version pointer to ${{ github.sha }}"
          git push
